name: Bug report
description: Report a reproducible problem in Agent Change Map
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private source code, exploit payloads, or unredacted sensitive logs. Report vulnerabilities privately from the repository Security tab.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain a security vulnerability or sensitive data.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: Agent Change Map did... I expected...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal, non-sensitive repository or example. Do not paste secrets, private code, or exploit payloads.
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Worktree reading or comparison
        - Proposed or applied edits
        - Restricted Docker snippet runtime
        - Python analysis
        - VS Code user interface
        - Other
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.95.3
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Agent Change Map version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      placeholder: e.g. 2.47.1
  - type: textarea
    id: runtime-versions
    attributes:
      label: Docker and Python versions (runtime issues only)
      description: Complete this only when the restricted snippet runtime or Python analysis is affected.
      placeholder: Docker 27.3.1; Python 3.12.7
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, usernames, private paths, repository content, and other sensitive data. Do not include exploit payloads.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any safe, relevant details or screenshots.
