schema: spec-driven

context: |
  Product: Agent Change Map, a VS Code extension (v0.0.1, in active MVP build-out).
  Scope: Python code structure/call/import diagrams and Git comparison workflows.
  Editing: temporary drafts by default, with confirmed atomic writes and optional direct-worktree mode.
  Execution: changed snippets run only in disposable, explicitly restricted Docker containers.
  Current state: TypeScript extension host (src/) + webview (webview/) + Python static analyzer
    (python/analyzer.py) bridged from the extension; git state capture, source navigation,
    draft overlays, and sandboxed Docker execution implemented on tracker branch
    feat/agent-change-map-mvp-04-restricted-execution.
  Host tools detected: Git, Node.js/npm, Python, uv, pytest, Ruff, Docker, and VS Code CLI.
  Artifact language: English.

strict_tdd: true

testing:
  detected_at: "2026-09-06T00:00:00-06:00"
  reason: "Project convention (README: RED-GREEN-REFACTOR per work unit) and user global preference (Strict TDD Mode: enabled) both confirm strict TDD; vitest is the active project test runner."
  runner:
    available: true
    framework: "vitest"
    command: "npm run test"
  layers:
    unit:
      available: true
      tool: "vitest (test/unit, npm run test:unit)"
    integration:
      available: true
      tool: "vitest (test/integration, npm run test:integration)"
    e2e:
      available: true
      tool: "VS Code Extension Development Host harness (scripts/vscode-harness.mjs, npm run test:e2e)"
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "npm run lint (eslint src test webview --max-warnings=0)"
    type_checker:
      available: true
      command: "npm run typecheck (tsc -p tsconfig.json --noEmit && tsc -p tsconfig.webview.json --noEmit)"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Keep the MVP boundary explicit and identify out-of-scope behavior.
    - Include rollback and safety implications for Git edits and code execution.
  specs:
    - Use RFC 2119 keywords for normative requirements.
    - Express acceptance scenarios in Given/When/Then form.
    - Specify trust boundaries and restrictions for Docker execution, network, resources, and filesystems.
  design:
    - Record architecture decisions and rationale before selecting implementation dependencies.
    - Include sequence diagrams for Git comparison, diagram navigation, editing, and snippet execution flows.
  tasks:
    - Group work by phase with hierarchical numbering.
    - Keep each task independently verifiable and small enough for one session.
    - Do not assume host-installed tools are project dependencies.
  apply:
    guidelines:
      - Follow approved proposal, specs, and design artifacts.
      - Introduce project tooling explicitly before relying on it.
      - Write a failing test first (RED), then the minimal implementation (GREEN), then refactor.
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test && npm run lint && npm run typecheck"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - Preserve archived changes as an immutable audit trail.
